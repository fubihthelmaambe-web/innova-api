<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>I-NNOVA API Demo</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    button { padding: 10px; margin: 5px; cursor: pointer; }
    pre { background: white; padding: 15px; border-radius: 5px; }
  </style>
</head>
<body>
  <h1>I-NNOVA KICKSTARTER API</h1>npm
  <p><b>Note:</b> Your Express server must be running on `localhost:3000` for this to work</p>
  
  <button onclick="getAll()">GET /fellows</button>
  <button onclick="getById(2)">GET /fellows/2</button>
  <button onclick="getByTier('rookie')">GET /fellows?tier=rookie</button>

  <h3>Result:</h3>
  <pre id="result">Click a button to test the API</pre>

 <script>
  const API = 'http://localhost:3000'; // Your Express server

  async function getAll() {
    document.getElementById('result').textContent = "Loading...";
    try {
      const res = await fetch(API + '/fellows');
      const data = await res.json();
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    } catch (error) {
      document.getElementById('result').textContent = "Error: Is your server running? " + error;
    }
  }

  async function getById(id) {
    document.getElementById('result').textContent = "Loading...";
    try {
      const res = await fetch(API + '/fellows/' + id);
      const data = await res.json();
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    } catch (error) {
      document.getElementById('result').textContent = "Error: Is your server running? " + error;
    }
  }

  async function getByTier(tier) {
    document.getElementById('result').textContent = "Loading...";
    try {
      const res = await fetch(API + '/fellows?tier=' + tier);
      const data = await res.json();
      document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    } catch (error) {
      document.getElementById('result').textContent = "Error: Is your server running? " + error;
    }
  }
</script>

</body>
</html>
